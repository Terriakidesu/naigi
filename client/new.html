<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>New conversation · priv-chat</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body class="auth-page">
    <header class="topbar">
      <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">✦</span><div><strong>priv-chat</strong><span class="tag">new conversation</span></div></div>
      <a class="text-link" href="/app">Back to chat</a>
    </header>
    <main class="auth-panel panel form-page-panel">
      <p class="eyebrow">NEW CONVERSATION</p>
      <h1>Start a private space.</h1>
      <p class="muted">Add one member for a direct message, or several members for a group. The server only sees account and membership metadata; messages remain encrypted.</p>
      <form id="new-conversation-form" class="stack">
        <label>Member user ID(s)
          <input id="new-member-id" placeholder="UUID, comma-separated" required>
        </label>
        <button id="create-submit" type="submit">Create encrypted conversation</button>
      </form>
      <p id="new-status" class="form-status" role="status"></p>
    </main>
    <script type="module" src="/new.js"></script>
  </body>
</html>
