<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Host operator sign in · Naigi</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  </head>
  <body class="auth-page">
    <div class="auth-background" aria-hidden="true"><span></span><span></span></div>
    <header class="topbar auth-topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">N</span>
        <div><strong>Naigi</strong><span class="tag">host operator console</span></div>
      </div>
      <div class="topbar-links"><a class="text-link" href="/">Chat sign in</a></div>
    </header>
    <main class="auth-panel panel">
      <div class="auth-mark" aria-hidden="true">N</div>
      <p class="eyebrow">HOST OPERATOR</p>
      <h1>Operator sign in</h1>
      <p class="muted">Use an operator identity provisioned by the host. This account is separate from chat accounts.</p>
      <form id="admin-auth-form" class="stack">
        <label>Operator username
          <input id="admin-auth-username" autocomplete="username" required minlength="3" maxlength="32">
        </label>
        <label>Password
          <input id="admin-auth-password" type="password" autocomplete="current-password" required minlength="12" maxlength="1024">
        </label>
        <button id="admin-auth-submit" type="submit">Sign in to console</button>
      </form>
      <p id="admin-auth-status" class="form-status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/instance-admin-login.js"></script>
  </body>
</html>
