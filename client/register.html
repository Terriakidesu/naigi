<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Create account · Naigi</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  </head>
  <body class="auth-page">
    <div class="auth-background" aria-hidden="true"><span></span><span></span></div>
    <header class="topbar auth-topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">N</span>
        <div><strong>Naigi</strong><span class="tag">self-hosted · privacy-focused chat</span></div>
      </div>
      <a class="text-link" href="/">Already have an account?</a>
    </header>
    <main class="auth-panel panel">
      <div class="auth-mark" aria-hidden="true">N</div>
      <p class="eyebrow">GET STARTED</p>
      <h1>Create your account.</h1>
      <p class="muted">Your account identifies members. Your messages and private keys remain encrypted in your browser.</p>
      <form id="register-form" class="stack">
        <label>Username
          <input id="register-username" autocomplete="username" required minlength="3" maxlength="32">
        </label>
        <label>Display name
          <input id="register-display-name" autocomplete="name" required minlength="1" maxlength="80">
        </label>
        <label>Password
          <input id="register-password" type="password" autocomplete="new-password" required minlength="12">
        </label>
        <button id="register-submit" type="submit">Create account</button>
      </form>
      <p id="register-status" class="form-status" role="status"></p>
    </main>
    <script type="module" src="/register.js"></script>
  </body>
</html>
